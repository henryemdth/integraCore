name: Build Windows Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'electron/**'

jobs:
  build-client:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env for Frontend (Client)
        shell: bash
        run: |
          echo "${{ secrets.ENV_CLIENT_FE }}" > frontend/.env

      - name: Build Frontend & Electron Client
        run: npm run build

      - name: Build Client Installer with Electron Builder
        run: npx electron-builder --win --config electron-builder-client.yml --projectDir electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Client Executable
        uses: actions/upload-artifact@v4
        with:
          name: IntegraCore-Client-Setup
          path: electron/dist-client/*.exe